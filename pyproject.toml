[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scione-test-spec-intelligence"
version = "0.1.0"
description = "A local lab workspace for extracting and reviewing customer test requirements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=2.22,<3",
    "groq>=0.31,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "streamlit>=1.64,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
scione = "scione.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scione = ["prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
